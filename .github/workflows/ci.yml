name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install test environment
        run: uv sync --locked --extra test --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --no-sync python -m pytest -m "not performance"

  minimum-versions:
    name: Minimum supported dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install minimum supported dependencies
        run: |
          uv venv .venv-min --python 3.11
          uv pip install --python .venv-min/bin/python --resolution lowest-direct '.[test]'
      - name: Run tests on minimum supported dependencies
        run: .venv-min/bin/python -m pytest -m "not performance"
      - name: Audit minimum supported dependencies
        run: >-
          uvx --from 'pip-audit>=2.8,<3' pip-audit
          --path .venv-min/lib/python3.11/site-packages

  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install quality environment
        run: uv sync --locked --extra test --extra quality --python 3.11
      - name: Lint and format
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
      - name: Type check
        run: uv run --no-sync mypy src
      - name: Security lint
        run: uv run --no-sync bandit -q -r src -ll
      - name: Coverage gate
        run: uv run --no-sync python -m pytest -m "not performance" --cov=options_engine --cov-report=term --cov-report=xml
      - name: Build and validate distributions
        run: |
          uv build
          uv run --no-sync twine check dist/*
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          assert "options_engine/py.typed" in names
          assert not any(name.startswith("tests/") for name in names)
          PY
      - name: Audit installed dependencies
        run: |
          uv export --quiet --locked --no-dev --no-emit-project --format requirements.txt --output-file /tmp/options-engine-runtime.txt
          uv run --no-sync pip-audit --strict --require-hashes --requirement /tmp/options-engine-runtime.txt
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: options-pricing-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: options-pricing-engine:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
